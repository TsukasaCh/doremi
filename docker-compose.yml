services:
  dashboard:
    build: .
    image: openvpn-manager
    container_name: openvpn-manager
    restart: unless-stopped
    ports:
      - "8080:8080"          # expose dashboard; restrict to mgmt LAN via firewall
    env_file:
      - ./backend/.env       # created from backend/.env.example (not in git)
    volumes:
      - ovpn_data:/app/backend/data   # persist SQLite DB across rebuilds

volumes:
  ovpn_data:
