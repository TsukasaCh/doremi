<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenVPN Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login view -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <h1>🔐 OpenVPN Manager</h1>
      <p class="muted">Masuk untuk mengelola user VPN</p>
      <label>Username<input id="login-user" autocomplete="username" required /></label>
      <label>Password<input id="login-pass" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Masuk</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- App shell: sidebar + content -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">🛡️ <span>OpenVPN<br>Manager</span></div>

      <nav class="nav">
        <button class="nav-item active" data-view="users"><span class="ic">👤</span> Pengguna</button>
        <button class="nav-item" data-view="groups"><span class="ic">🗂️</span> ACL Group</button>
        <button class="nav-item" data-view="iptables"><span class="ic">🧱</span> iptables</button>
        <button class="nav-item" data-view="audit"><span class="ic">📜</span> Audit Log</button>
      </nav>

      <div class="sidebar-foot">
        <div class="agents" id="agent-status"></div>
        <div class="whoami-row">
          <span id="whoami" class="muted"></span>
          <button id="logout-btn" class="ghost small">Keluar</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-head">
        <h1 id="page-title">Pengguna</h1>
        <div class="page-actions" id="page-actions"></div>
      </header>
      <div id="view-root"></div>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="card modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
