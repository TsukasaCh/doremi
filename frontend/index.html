<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenVPN Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Decoy view: neutral sign-in shown first; the real login is revealed
       only after the secret unlock code is entered (obscurity, not security). -->
  <div id="decoy-view" class="decoy-wrap hidden">
    <form id="decoy-form" class="decoy-card">
      <div class="decoy-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Masuk</h1>
      <p class="decoy-sub">Masukkan email untuk melanjutkan.</p>
      <label class="decoy-field">
        <span>Email atau nomor telepon</span>
        <input id="decoy-input" type="text" autocomplete="username" autofocus />
      </label>
      <button type="submit">Berikutnya</button>
      <div id="decoy-error" class="decoy-error"></div>
    </form>
  </div>

  <!-- Login view -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <h1>🔐 OpenVPN Manager</h1>
      <p class="muted">Masuk untuk mengelola user VPN</p>
      <label>Username<input id="login-user" autocomplete="username" required /></label>
      <label>Password<input id="login-pass" type="password" autocomplete="current-password" required /></label>
      <label id="login-2fa-row" class="hidden">Kode 2FA<input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" /></label>
      <button type="submit">Masuk</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- App shell: sidebar + content -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>OpenVPN<br>Manager</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-view="users">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Pengguna
        </button>
        <button class="nav-item" data-view="connected">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          Client Aktif
        </button>
        <button class="nav-item" data-view="groups">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          ACL Group
        </button>
        <button class="nav-item" data-view="forwards">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
          Port Forward
        </button>
        <button class="nav-item" data-view="iptables">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          iptables
        </button>
        <button class="nav-item" data-view="audit">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
          Audit Log
        </button>
        <button class="nav-item" data-view="account">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Pengaturan
        </button>
        <button class="nav-item" data-view="admins" id="nav-admins">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-3-3.87"/><path d="M4 21v-2a4 4 0 0 1 3-3.87"/><circle cx="12" cy="7" r="4"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          IAM
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="agents" id="agent-status"></div>
        <div class="whoami-row">
          <span id="whoami" class="muted"></span>
          <button id="logout-btn" class="ghost small">Keluar</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-head">
        <h1 id="page-title">Pengguna</h1>
        <div class="page-actions" id="page-actions"></div>
      </header>
      <div id="view-root"></div>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="card modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
