<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenVPN Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login view -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <h1>🔐 OpenVPN Manager</h1>
      <p class="muted">Masuk untuk mengelola user VPN</p>
      <label>Username<input id="login-user" autocomplete="username" required /></label>
      <label>Password<input id="login-pass" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Masuk</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- App shell: sidebar + content -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>OpenVPN<br>Manager</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="users">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Pengguna
        </button>
        <button class="nav-item" data-view="groups">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          ACL Group
        </button>
        <button class="nav-item" data-view="iptables">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          iptables
        </button>
        <button class="nav-item" data-view="audit">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
          Audit Log
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="agents" id="agent-status"></div>
        <div class="whoami-row">
          <span id="whoami" class="muted"></span>
          <button id="logout-btn" class="ghost small">Keluar</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-head">
        <h1 id="page-title">Pengguna</h1>
        <div class="page-actions" id="page-actions"></div>
      </header>
      <div id="view-root"></div>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="card modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
