# OpenVPN Manager — nginx reverse proxy
# Deploy on the nginx VM (10.10.10.105):
#   sudo cp vvpn.redlimit.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/vvpn.redlimit.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: get a trusted cert first (see deploy/nginx/README.md). The paths below
# assume certbot's Let's Encrypt layout; adjust if you use Cloudflare Origin.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name vvpn.redlimit.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vvpn.redlimit.id;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/vvpn.redlimit.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vvpn.redlimit.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- hardening ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # .ovpn payloads / API bodies are small; keep a sane cap
    client_max_body_size 4m;

    # ---- proxy to the dashboard/API container on 10.10.10.110 ----
    location / {
        proxy_pass http://10.10.10.110:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
