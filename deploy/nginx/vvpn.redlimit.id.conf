# OpenVPN Manager — nginx reverse proxy (HTTP-only starting point)
#
# Deploy on the nginx VM (10.10.10.105), then let certbot add TLS for you:
#   sudo cp vvpn.redlimit.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/vvpn.redlimit.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vvpn.redlimit.id      # HTTP-01, no Cloudflare token
#
# `certbot --nginx` rewrites this file in place: it adds a `listen 443 ssl`
# server with the cert paths and turns this block into an HTTP->HTTPS redirect.
# Requirement: vvpn.redlimit.id must resolve to this VM and be reachable from
# the internet on port 80 during issuance (grey-cloud the record if it's
# proxied through Cloudflare, or use Full(strict) once done).

server {
    listen 80;
    listen [::]:80;
    server_name vvpn.redlimit.id;

    # .ovpn payloads / API bodies are small; keep a sane cap
    client_max_body_size 4m;

    location / {
        proxy_pass http://10.10.10.110:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
